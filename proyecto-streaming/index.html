<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming TV | Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <style>
        :root {
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --accent-orange: #f59e0b;
        }

        body {
            background: radial-gradient(circle at 0% 0%, #1e293b 0%, #0f172a 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism Pro */
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Toastify Custom Styles */
        .toast-custom {
            border-radius: 16px !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            font-weight: 600 !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4) !important;
        }

        /* Scrollbar Estilizada */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: var(--accent-indigo); }

        .item-row { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .item-row:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(4px);
        }

        .btn-action { transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .btn-action:hover {
            transform: scale(1.05) translateY(-2px);
            filter: brightness(1.2);
        }

        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>

<body class="text-slate-200 min-h-screen pb-12">

<div class="max-w-6xl mx-auto pt-12 px-6">
    
    <header class="flex flex-col md:flex-row items-end justify-between mb-12 animate__animated animate__fadeInDown">
        <div class="space-y-2">
            <div class="flex items-center gap-4">
                <div class="p-3 bg-indigo-600 rounded-2xl shadow-lg shadow-indigo-500/20">
                    <i class="fas fa-broadcast-tower text-2xl text-white"></i>
                </div>
                <div>
                    <h1 class="text-5xl font-extrabold text-white tracking-tighter">
                        Streaming<span class="text-indigo-500">TV</span>
                    </h1>
                    <p class="text-slate-400 font-medium tracking-wide uppercase text-[10px] mt-2">La televisión que conoces, con el contenido que nos une.</p>
                </div>
            </div>
        </div>

        <div class="flex gap-4 mt-8 md:mt-0">
            <button onclick="addCintilla()" class="btn-action bg-white/5 border border-white/10 hover:border-orange-500/50 px-6 py-3 rounded-2xl flex items-center gap-3 group">
                <i class="fas fa-plus-circle text-orange-500 group-hover:rotate-90 transition-transform"></i>
                <span class="font-bold">Nueva Cintilla</span>
            </button>
            <button onclick="addVideo()" class="btn-action bg-indigo-600 shadow-xl shadow-indigo-500/20 px-6 py-3 rounded-2xl flex items-center gap-3">
                <i class="fas fa-play text-xs text-white"></i>
                <span class="font-bold text-white">Añadir Video</span>
            </button>
        </div>
    </header>

    <div class="glass-card rounded-3xl p-3 mb-12 flex flex-wrap gap-4 items-center justify-between animate__animated animate__fadeInUp animate__delay-1s">
        <div class="flex gap-2 p-1 bg-black/20 rounded-2xl">
            <button onclick="setMode('orden')" class="px-6 py-2 rounded-xl font-bold text-sm transition-all hover:bg-white/10 flex items-center gap-2">
                <i class="fas fa-sort-amount-down"></i> Secuencial
            </button>
            <button onclick="setMode('aleatorio')" class="px-6 py-2 rounded-xl font-bold text-sm transition-all hover:bg-white/10 flex items-center gap-2">
                <i class="fas fa-random"></i> Shuffle
            </button>
        </div>

        <div class="flex gap-4">
            <button id="btn-shuffle" onclick="shuffleNow()" class="hidden btn-action bg-white/5 border border-white/10 px-6 py-2 rounded-xl font-bold text-sm">
                <i class="fas fa-sync-alt mr-2"></i> Remezclar lista
            </button>
            <button id="btn-logo" onclick="toggleLogoDetector()" class="btn-action px-6 py-2 rounded-xl font-bold text-sm flex items-center gap-2"></button>
            <button id="btn-stream" onclick="toggleStream()" class="btn-action px-8 py-2 rounded-xl font-bold text-sm flex items-center gap-2"></button>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
        <section class="animate__animated animate__fadeInLeft animate__delay-1s">
            <div class="flex items-center justify-between mb-4 px-2">
                <h2 class="text-sm font-bold uppercase tracking-[0.2em] text-slate-500">Recursos de Imagen</h2>
                <div class="h-px flex-1 bg-white/5 mx-4"></div>
                <span class="text-[10px] bg-white/5 px-2 py-1 rounded border border-white/10 uppercase">Cintillas</span>
            </div>
            <div class="glass-card rounded-[2rem] overflow-hidden">
                <div id="cintillas-list" class="max-h-[500px] overflow-y-auto custom-scrollbar divide-y divide-white/5"></div>
                <div id="cintillas-empty" class="hidden py-20 text-center">
                    <i class="fas fa-image text-slate-600 text-3xl mb-4"></i>
                    <p class="text-slate-500 text-sm italic">Biblioteca vacía</p>
                </div>
            </div>
        </section>

        <section class="animate__animated animate__fadeInRight animate__delay-1s">
            <div class="flex items-center justify-between mb-4 px-2">
                <h2 class="text-sm font-bold uppercase tracking-[0.2em] text-indigo-400">Lista de Reproducción</h2>
                <div class="h-px flex-1 bg-white/5 mx-4"></div>
                <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-1 rounded border border-indigo-500/20 uppercase">Video</span>
            </div>
            <div class="glass-card rounded-[2rem] overflow-hidden border-indigo-500/10">
                <div id="playlist" class="max-h-[500px] overflow-y-auto custom-scrollbar divide-y divide-white/5"></div>
                <div id="empty-state" class="hidden py-20 text-center">
                    <i class="fas fa-film text-slate-600 text-3xl mb-4"></i>
                    <p class="text-slate-500 text-sm italic">No hay videos en lista</p>
                </div>
            </div>
        </section>
    </div>
</div>

<script>
// --- Sistema de Notificaciones ---
function notify(text, type = 'success') {
    const config = {
        success: { bg: "linear-gradient(to right, #059669, #10b981)", icon: "✅" },
        error: { bg: "linear-gradient(to right, #dc2626, #ef4444)", icon: "❌" },
        info: { bg: "linear-gradient(to right, #4f46e5, #6366f1)", icon: "ℹ️" },
        warning: { bg: "linear-gradient(to right, #d97706, #f59e0b)", icon: "⚠️" }
    };

    Toastify({
        text: `${config[type].icon} ${text}`,
        duration: 3000,
        gravity: "top",
        position: "right",
        className: "toast-custom",
        style: { background: config[type].bg },
        stopOnFocus: true
    }).showToast();
}

async function refreshStatus() {
    try {
        const res = await fetch('/status');
        const data = await res.json();

        // Render Videos
        const container = document.getElementById('playlist');
        const emptyState = document.getElementById('empty-state');
        const videos = data.orden_actual?.length > 0 ? data.orden_actual : data.videos;

        if (!videos.length) {
            emptyState.classList.remove("hidden");
            container.innerHTML = "";
        } else {
            emptyState.classList.add("hidden");
            container.innerHTML = videos.map((path, i) => `
                <div class="item-row flex items-center justify-between p-5">
                    <div class="flex items-center gap-5 overflow-hidden">
                        <span class="text-[10px] font-black text-indigo-500/50">${String(i+1).padStart(2, '0')}</span>
                        <div class="h-10 w-10 rounded-xl bg-slate-800 border border-white/10 flex items-center justify-center">
                            <i class="fas fa-play text-[10px] text-indigo-400"></i>
                        </div>
                        <div class="flex flex-col overflow-hidden">
                            <span class="truncate text-sm font-bold text-slate-200">${path.split(/[\\/]/).pop()}</span>
                            <span class="text-[10px] text-slate-500 uppercase">Recurso de video</span>
                        </div>
                    </div>
                    <button onclick="removeVideo('${path.replace(/\\/g, '/')}')" class="h-10 w-10 rounded-xl hover:bg-red-500/10 text-slate-600 hover:text-red-500 transition-all flex items-center justify-center">
                        <i class="fas fa-trash-alt text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        // Render Cintillas
        const cContainer = document.getElementById('cintillas-list');
        const cEmpty = document.getElementById('cintillas-empty');
        const cintillas = data.cintillas || [];

        if (!cintillas.length) {
            cEmpty.classList.remove("hidden");
            cContainer.innerHTML = "";
        } else {
            cEmpty.classList.add("hidden");
            cContainer.innerHTML = cintillas.map((path) => `
                <div class="item-row flex items-center justify-between p-5">
                    <div class="flex items-center gap-5 overflow-hidden">
                        <div class="h-12 w-12 rounded-xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center">
                            <i class="fas fa-layer-group text-orange-500"></i>
                        </div>
                        <div class="flex flex-col overflow-hidden">
                            <span class="truncate text-sm font-bold text-slate-200">${path.split(/[\\/]/).pop()}</span>
                            <span class="text-[10px] text-slate-500 uppercase">Publicidad en cintilla</span>
                        </div>
                    </div>
                    <button onclick="removeCintilla('${path.replace(/\\/g, '/')}')" class="h-10 w-10 rounded-xl hover:bg-red-500/10 text-slate-600 hover:text-red-500 transition-all flex items-center justify-center">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `).join('');
        }

        // Control Stream Button
        const sBtn = document.getElementById("btn-stream");
        if (data.streaming) {
            sBtn.innerHTML = `<span class="relative flex h-3 w-3 mr-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-white opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-white"></span></span> DETENER TRANSMISIÓN`;
            sBtn.className = "btn-action pulse-red bg-red-500 text-white px-8 py-2.5 rounded-xl font-black text-sm";
        } else {
            sBtn.innerHTML = `<i class="fas fa-satellite-dish mr-2"></i> INICIAR EMISIÓN`;
            sBtn.className = "btn-action bg-emerald-500 text-white px-8 py-2.5 rounded-xl font-black text-sm shadow-lg shadow-emerald-500/20";
        }

        // Control Logo Button
        const lBtn = document.getElementById("btn-logo");
        if (data.logo_detector) {
            lBtn.innerHTML = `<i class="fas fa-eye-slash mr-2"></i> DETENER DETECTOR`;
            lBtn.className = "btn-action bg-slate-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm border border-slate-600";
        } else {
            lBtn.innerHTML = `<i class="fas fa-bullseye mr-2"></i> DETECTAR LOGO`;
            lBtn.className = "btn-action bg-amber-500 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-amber-500/20";
        }

        document.getElementById("btn-shuffle").classList.toggle("hidden", data.modo !== "aleatorio");
    } catch (e) {
        console.error("Error actualizando status", e);
    }
}

// Acciones con Notificaciones
async function addCintilla() {
    const res = await fetch('/seleccionar_cintilla', { method: 'POST' });
    const data = await res.json();
    if (data.status === 'success') {
        notify("Cintilla añadida correctamente");
        refreshStatus();
    }
}

async function removeCintilla(path) {
    await fetch('/remove_cintilla', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({path})
    });
    notify("Cintilla eliminada", "warning");
    refreshStatus();
}

async function addVideo() {
    const res = await fetch('/seleccionar_archivo', { method: 'POST' });
    const data = await res.json();
    if (data.status === 'success') {
        notify("Video añadido a la lista");
        refreshStatus();
    }
}

async function removeVideo(path) {
    await fetch('/remove_video', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({path})
    });
    notify("Video quitado de la lista", "warning");
    refreshStatus();
}

async function toggleStream() {
    const res = await fetch('/toggle_stream', { method: 'POST' });
    const data = await res.json();
    if (data.status === "started") notify("🔴 EMISIÓN INICIADA EN VIVO", "info");
    if (data.status === "stopped") notify("Emisión detenida", "warning");
    refreshStatus();
}

async function toggleLogoDetector() {
    const res = await fetch('/toggle_logo_detector', { method: 'POST' });
    const data = await res.json();
    if (data.status === "started") notify("🎯 Detector de logo activado", "info");
    else notify("Detector desactivado", "info");
    refreshStatus();
}

async function setMode(modo) {
    await fetch('/set_mode', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({modo})
    });
    notify(`Modo cambiado a: ${modo.toUpperCase()}`, "info");
    refreshStatus();
}

async function shuffleNow() {
    await fetch('/shuffle_now', { method: 'POST' });
    notify("Lista remezclada aleatoriamente", "info");
    refreshStatus();
}

// Inicialización
refreshStatus();
setInterval(refreshStatus, 5000); // Auto-refresh cada 5s para sincronía
</script>

</body>
</html>
